[project]
name = "boss"
version = "2.2.0"
description = "Provision a server"
readme = "README.md"
authors = [
    { name = "Sheldon McGrandle", email = "developer@8cylinder.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "distro>=1.9.0",
    "dotenv>=0.9.9",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "ruff-lsp>=0.0.62",
]

[tool.setuptools.data-files]
"share/man/man1" = ["man/boss.1"]

[project.scripts]
boss = "boss:cli.boss"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "coverage>=7.10.2",
    "ipython>=9.4.0",
    "mypy>=1.15.0",
    "pyright>=1.1.401",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.11.0",
]
